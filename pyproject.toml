[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-alpha-agent"
version = "0.5.7"
description = "Read-only DeFi opportunity scanner for Pendle, Morpho and GMX"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
defi-alpha-agent = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]